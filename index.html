<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루씩, 유럽</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루씩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--ink:#1d1b18;--sub:#857d72;--line:#e8e1d5;--accent:#e2572b;--soft:#fbe6dc;--spend:#2f7d5b;--plan:#3f63c7;--note:#8a5cc2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--card:#1e1b18;--ink:#f1ece4;--sub:#a39a8e;--line:#332e28;--accent:#ff7a4d;--soft:#3a2219;--spend:#5fc596;--plan:#8aa5ff;--note:#c39cf0}}
:root[data-theme="dark"]{--bg:#141210;--card:#1e1b18;--ink:#f1ece4;--sub:#a39a8e;--line:#332e28;--accent:#ff7a4d;--soft:#3a2219;--spend:#5fc596;--plan:#8aa5ff;--note:#c39cf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.45;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:12px 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
.route{display:flex;align-items:center;overflow-x:auto;gap:0;padding:6px 2px 12px;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.stop{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;font-size:12px;color:var(--sub)}
.stop i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.stop.past i{background:var(--sub)}
.stop.on{color:var(--accent);font-weight:700}.stop.on i{background:var(--accent);box-shadow:0 0 0 5px var(--soft)}
.bar{flex:1;min-width:14px;height:2px;background:var(--line);margin-bottom:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px}
.dayno{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.5px}
h1{margin:2px 0 0;font-size:30px;letter-spacing:-.8px;line-height:1.1}
.date{color:var(--sub);font-size:15px;margin-top:4px}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.summary>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.summary b{display:block;font-size:18px}
.summary span{font-size:12px;color:var(--sub)}
.moods{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 10px;margin-top:8px;align-items:center}
.moods small{color:var(--sub)}
.moods button{font-size:24px;filter:grayscale(1);opacity:.45;padding:4px;transition:.15s}
.moods button.on{filter:none;opacity:1;transform:scale(1.2)}
.diary{background:var(--soft);border-radius:16px;padding:14px 16px;margin-top:12px;white-space:pre-wrap;font-size:15px}
.diary small{display:block;color:var(--sub);margin-top:6px}
.timeline{margin-top:18px;position:relative}
.timeline:before{content:"";position:absolute;left:19px;top:6px;bottom:6px;width:2px;background:var(--line)}
.e{display:flex;gap:12px;position:relative;padding:6px 0}
.e .dot{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:17px;z-index:1}
.e.spend .dot{border-color:var(--spend)}.e.plan .dot{border-color:var(--plan)}.e.note .dot{border-color:var(--note)}.e.photo .dot{border-color:var(--accent)}
.e .body{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.e .meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.e .txt{margin-top:2px;word-break:break-word}
.e .amt{font-weight:800;color:var(--spend)}
.e.plan.todo .body{border-style:dashed;background:transparent}
.e.plan.done .txt{text-decoration:line-through;color:var(--sub)}
.e img{width:100%;border-radius:12px;display:block;margin-top:6px;max-height:340px;object-fit:cover}
.e .acts{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:6px}
.e .acts button{color:var(--sub)}
.e .acts .go{color:var(--plan);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.composer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 12px calc(12px + env(safe-area-inset-bottom));z-index:9}
.composer .in{max-width:560px;margin:auto}
.guess{font-size:13px;color:var(--sub);margin:0 6px 6px;min-height:20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.guess button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:13px}
.guess button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:none;outline:none;resize:none;padding:9px 6px;max-height:120px;min-height:40px;font-size:16px}
.circle{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.cam{background:var(--bg)}
.send{background:var(--accent);color:#fff;font-weight:800}
.send:disabled{opacity:.35}
.cam input{display:none}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.toolbar button{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;align-items:flex-end}
.sheet.show{display:flex}
.sheet .pane{background:var(--bg);width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:21px}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.barline{height:6px;background:var(--soft);border-radius:3px;margin-top:4px}
.barline i{display:block;height:100%;background:var(--accent);border-radius:3px}
.big{font-size:32px;font-weight:800;letter-spacing:-1px}
.sub{color:var(--sub);font-size:13px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.field{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.pbtn{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700}
.pbtn.ghostbtn{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.bookday{border-top:1px solid var(--line);padding:14px 0;cursor:pointer}
.bookday h3{margin:2px 0 6px}
.bookday p{margin:4px 0 8px;white-space:pre-wrap}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.pbtn.danger{background:none;color:#d14343;border:1px solid var(--line)}
</style>
</head>
<body>
<main id="app"></main>

<div class="composer"><div class="in">
  <div class="guess" id="guess"></div>
  <div class="box">
    <label class="circle cam" title="사진" id="camwrap">📷<input type="file" id="file" accept="image/*" multiple></label>
    <textarea id="q" rows="1" placeholder="뭐든 적어요 · 점심 18유로 / 14:00 렐루서점 / 노을 미쳤다"></textarea>
    <button class="circle send" id="send" disabled aria-label="기록">↑</button>
  </div>
</div></div>

<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========= 여행 설정 ========= */
const CONFIG = {
  cities: [ // [시작, 끝, 도시, 통화, 이모지]
    ["2026-11-17","2026-11-19","포르투","EUR","🍷"],
    ["2026-11-20","2026-11-21","세비야","EUR","💃"],
    ["2026-11-22","2026-11-24","그라나다","EUR","🕌"],
    ["2026-11-25","2026-11-27","바르셀로나","EUR","⛪"],
    ["2026-11-28","2026-11-29","로마","EUR","🏛️"],
    ["2026-11-30","2026-12-01","피렌체","EUR","🎨"],
    ["2026-12-02","2026-12-03","체르마트","CHF","🏔️"],
    ["2026-12-04","2026-12-06","인터라켄","CHF","🚡"],
  ],
  rates: { EUR:1600, CHF:1700, KRW:1 },
};
/* ============================ */

const CATS = {식사:["점심","저녁","아침","식사","브런치","밥","식당","레스토랑","타파스","피자","파스타"],커피:["커피","카페","라떼","디저트","젤라또","빵","에그타르트","나타"],교통:["택시","우버","볼트","기차","버스","지하철","메트로","트램","교통","공항"],쇼핑:["쇼핑","기념품","선물","옷","마트","슈퍼"],입장:["입장","박물관","투어","성당","미술관","티켓"],숙소:["숙소","호텔","숙박","도시세"]};
const CAT_ICON = {식사:"🍽️",커피:"☕",교통:"🚆",쇼핑:"🛍️",입장:"🎟️",숙소:"🛏️",기타:"💳"};
const MOODS = ["😫","😐","🙂","😊","🤩"];
const W = ["일","월","화","수","목","금","토"];
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const P = s => new Date(s+"T00:00");
const add = (s,n) => { const d=P(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const FIRST = CONFIG.cities[0][0], LAST = CONFIG.cities.at(-1)[1];
const cityOf = d => CONFIG.cities.find(c=>d>=c[0]&&d<=c[1]);
const dayNo = d => Math.round((P(d)-P(FIRST))/864e5)+1;
const TOTAL_DAYS = dayNo(LAST);
const won = n => "₩"+Math.round(n).toLocaleString("ko-KR");
const krw = e => (e.amount||0)*(CONFIG.rates[e.cur]||1);
const money = e => e.cur==="KRW"?won(e.amount):`${(+e.amount).toLocaleString("ko-KR")}${e.cur==="EUR"?"€":" CHF"}`;
const nowHM = () => new Date().toTimeString().slice(0,5);
const tnow = () => S.date===TODAY ? nowHM() : "";
const ls = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function toast(m){const t=$("#toast");t.textContent=m;S&&(S.undo=null);t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1700);}

var S = { me:null, names:{}, undo:null, date: TODAY>=FIRST&&TODAY<=LAST?TODAY:FIRST, entries:[], days:{}, force:null };

/* ---------- 저장: claude.ai db 우선, 없으면 이 기기 ---------- */
let db=null, assets=null, sample=null, user=null, downloads=null;
const local = () => { S.entries=ls.get("L_entries",[]); S.days=ls.get("L_days",{}); Object.assign(CONFIG.rates,ls.get("L_rates",{})); };
async function saveRates(r){ Object.assign(CONFIG.rates,r); if(db) await db.collection("meta").doc("settings").set({rates:{EUR:CONFIG.rates.EUR,CHF:CONFIG.rates.CHF}}); else { ls.set("L_rates",r); render(); } }
const people = () => [...new Set([S.me||"me",...S.entries.filter(e=>e.type==="spend"&&e.by).map(e=>e.by)])];
const nameOf = id => id===(S.me||"me") ? "나" : (S.names[id]||"동행");
async function loadNames(){ if(!user) return; const ids=people().filter(i=>i!=="me"); try{ const ps=await user.profiles(ids); ids.forEach(i=>S.names[i]=ps[i]?.name||""); }catch{} }
async function addEntry(o){ o.at=Date.now(); if(o.type==="spend"){ o.by=o.by||S.me||"me"; o.shared=o.shared??true; } if(db) await db.collection("entries").add(o); else { o.id=Math.random().toString(36).slice(2); S.entries.push(o); ls.set("L_entries",S.entries); render(); } }
async function updEntry(id,patch){ if(db) await db.collection("entries").doc(id).update(patch); else { Object.assign(S.entries.find(e=>e.id===id),patch); ls.set("L_entries",S.entries); render(); } }
async function delEntry(id){ if(db) await db.collection("entries").doc(id).delete(); else { S.entries=S.entries.filter(e=>e.id!==id); ls.set("L_entries",S.entries); render(); } }
async function setDay(d,patch){ const v={...(S.days[d]||{}),...patch,date:d}; if(db) await db.collection("days").doc(d).set(v); else { S.days[d]=v; ls.set("L_days",S.days); render(); } }
const safe = fn => async(...a)=>{ try{ await fn(...a); }catch(e){ toast("저장 실패: "+(e?.message||e?.code||"오류")); } };

/* ---------- 한 줄 → 무엇인지 알아서 판단 ---------- */
function guess(line, date){
  line=line.trim(); if(!line) return null;
  const tm = line.match(/^(\d{1,2})[:시](\d{2})?\s*분?\s+(.+)/);
  const nums=[...line.matchAll(/(\d+(?:[.,]\d+)*)\s*(유로|eur|€|프랑|chf|만원|원|krw|번째|번|명|개|일차|일|분|층|호|시간|시|km|키로|정거장|박|살|%|월)?/gi)];
  const mm = nums.find(n=>n[2]&&/유로|eur|€|프랑|chf|원|krw/i.test(n[2])) || nums.find(n=>!n[2]);
  let cat=null; for(const [k,w] of Object.entries(CATS)) if(w.some(x=>line.includes(x))){cat=k;break;}
  const out = { date, text: line };
  if(tm){ return {...out,type:"plan",time:`${tm[1].padStart(2,"0")}:${tm[2]||"00"}`,text:tm[3],done:false}; }
  if(mm && (mm[2] || cat || /카드|현금/.test(line))){
    let amount=parseFloat(/,\d{3}$/.test(mm[1])?mm[1].replace(",",""):mm[1].replace(",",".")), u=(mm[2]||"").toLowerCase(), cur=cityOf(date)?.[3]||"EUR";
    if(/유로|eur|€/.test(u)) cur="EUR"; else if(/프랑|chf/.test(u)) cur="CHF"; else if(u==="만원"){cur="KRW";amount*=1e4;} else if(/원|krw/.test(u)) cur="KRW";
    const text=line.replace(mm[0],"").replace(/카드|현금/g,"").replace(/\s+/g," ").trim();
    return {...out,type:"spend",amount,cur,cat:cat||"기타",pay:/현금/.test(line)?"현금":"카드",text:text||cat||"지출",time:tnow()};
  }
  return {...out,type:"note",time:tnow()};
}
const TYPE_LABEL = {spend:"💸 지출",plan:"🗓️ 일정",note:"✏️ 메모"};
function convert(g, type){
  if(!g||g.type===type) return g;
  if(type==="note") return {date:g.date,type,text:g.type==="spend"?`${g.text} ${money(g)}`:g.text,time:tnow()};
  if(type==="plan") return {date:g.date,type,text:g.text,time:g.time||tnow(),done:false};
  if(type==="spend"){ const m=g.text.match(/(\d+(?:[.,]\d+)?)/); if(!m) return null; return guess(g.text.replace(m[0],"")+" "+m[1]+(cityOf(g.date)?.[3]==="CHF"?"chf":"유로"),g.date); }
}
function current(){ const lines=$("#q").value.split("\n").filter(l=>l.trim()); return lines.map(l=>{ let g=guess(l,S.date); if(S.force) g=convert(g,S.force)||g; return g; }); }
function updateGuess(){
  const items=current(); $("#send").disabled=!items.length;
  const q=$("#q"); q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,120)+"px";
  if(!items.length){ $("#guess").innerHTML=""; S.force=null; return; }
  const t=items[0].type;
  const desc=items.map(g=>g.type==="spend"?`${g.cat} ${money(g)}`:g.type==="plan"?`${g.time} ${esc(g.text)}`:"메모").join(" · ");
  $("#guess").innerHTML=Object.entries(TYPE_LABEL).map(([k,l])=>`<button data-force="${k}" class="${k===t?"on":""}">${l}</button>`).join("")+`<span>${desc}</span>`;
}

/* ---------- 그리기 ---------- */
function route(){
  const cur=cityOf(S.date);
  return CONFIG.cities.map((c,i)=>`${i?'<div class="bar"></div>':""}<button class="stop ${c===cur?"on":""} ${c[1]<S.date?"past":""}" data-date="${c[0]}"><i></i>${c[4]} ${c[2]}</button>`).join("");
}
function entryHTML(e){
  const icon = e.type==="spend"?CAT_ICON[e.cat]||"💳":e.type==="plan"?(e.done?"✅":"🗓️"):e.type==="photo"?"📷":"✏️";
  let body="";
  if(e.type==="spend") body=`<div class="meta"><span>${e.time?esc(e.time)+" · ":""}${esc(e.cat)} · ${esc(e.pay)}${people().length>1?` · ${esc(nameOf(e.by))}${e.shared===false?" 개인":""}`:""}</span><span class="amt">${money(e)}</span></div><div class="txt">${esc(e.text)}${e.cur!=="KRW"?` <span class="sub">${won(krw(e))}</span>`:""}</div>`;
  else if(e.type==="photo") body=`<div class="meta"><span>${esc(e.time||"")}</span></div><img src="${esc(e.url||"/_blob/"+e.assetId)}" alt="${esc(e.text||"사진")}" loading="lazy">${e.text?`<div class="txt">${esc(e.text)}</div>`:""}`;
  else body=`<div class="meta"><span>${esc(e.time||"")}${e.type==="plan"?(e.done?" · 다녀옴":" · 예정"):""}</span></div><div class="txt">${esc(e.text)}</div>`;
  const acts = `${e.type==="plan"?`<button class="go" data-done="${e.id}">${e.done?"되돌리기":"다녀왔어요 ✓"}</button>`:""}<button data-cap="${e.id}">${e.type==="photo"?"설명":"수정"}</button><button data-del="${e.id}">삭제</button>`;
  return `<div class="e ${e.type} ${e.type==="plan"?(e.done?"done":"todo"):""}"><div class="dot">${icon}</div><div class="body">${body}<div class="acts">${acts}</div></div></div>`;
}
function render(){
  const d=S.date, c=cityOf(d), x=P(d), day=S.days[d]||{};
  const list=S.entries.filter(e=>e.date===d).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")||(a.at||0)-(b.at||0));
  const spent=list.filter(e=>e.type==="spend").reduce((s,e)=>s+krw(e),0);
  const photos=list.filter(e=>e.type==="photo").length;
  const plans=list.filter(e=>e.type==="plan"), done=plans.filter(p=>p.done).length;
  const no=dayNo(d), inTrip=no>=1&&no<=TOTAL_DAYS;
  const nth = c ? dayNo(d)-dayNo(c[0])+1 : 0;
  $("#app").innerHTML=`
  <div class="route" id="route">${route()}</div>
  <div class="head"><div>
    <div class="dayno">${inTrip?`DAY ${no} / ${TOTAL_DAYS}`:no<1?`D-${1-no}`:"여행 후"}</div>
    <h1>${c?`${c[4]} ${esc(c[2])} ${nth}일차`:"여행 밖의 날"}</h1>
    <div class="date">${x.getMonth()+1}월 ${x.getDate()}일 ${W[x.getDay()]}요일${d===TODAY?" · 오늘":""}</div>
  </div><div class="arrows"><button data-step="-1" aria-label="전날">‹</button><button data-step="1" aria-label="다음날">›</button></div></div>
  <div class="summary">
    <div><span>오늘 쓴 돈</span><b>${won(spent)}</b></div>
    <div><span>다녀온 곳</span><b>${done}/${plans.length}</b></div>
    <div><span>사진</span><b>${photos}장</b></div>
  </div>
  <div class="moods"><small>오늘 기분</small>${MOODS.map((m,i)=>`<button class="${day.mood===i?"on":""}" data-mood="${i}">${m}</button>`).join("")}</div>
  ${day.diary?`<div class="diary">${esc(day.diary)}<small>오늘의 한 장</small></div>`:""}
  <div class="timeline">${list.length?list.map(entryHTML).join(""):`<div class="empty"><b>아직 비어있는 하루</b>아래 칸에 아무거나 적어보세요.<br>금액이 있으면 지출, 시간으로 시작하면 일정,<br>나머지는 메모로 알아서 들어가요.</div>`}</div>
  <div class="toolbar"><button data-act="stats">📊 여행 전체 보기</button>${list.length?`<button data-act="wrap">${sample?"✨ ":""}하루 마무리</button>`:""}</div>`;
  const on=document.querySelector(".stop.on"), rt=$("#route"); if(on) rt.scrollLeft=on.offsetLeft-rt.clientWidth/2+on.clientWidth/2;
}

function stats(){
  const sp=S.entries.filter(e=>e.type==="spend"), tot=sp.reduce((s,e)=>s+krw(e),0);
  const byCity=CONFIG.cities.map(c=>[c,sp.filter(e=>e.date>=c[0]&&e.date<=c[1]).reduce((s,e)=>s+krw(e),0)]);
  const byCat={}; sp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+krw(e));
  const max=Math.max(1,...byCity.map(x=>x[1]));
  const days=new Set(sp.map(e=>e.date)).size||1;
  $("#pane").innerHTML=`<h2>여행 전체</h2><div class="sub">사진 ${S.entries.filter(e=>e.type==="photo").length}장 · 메모 ${S.entries.filter(e=>e.type==="note").length}개 · 다녀온 곳 ${S.entries.filter(e=>e.type==="plan"&&e.done).length}곳</div>
  <div class="big" style="margin-top:12px">${won(tot)}</div><div class="sub">하루 평균 ${won(tot/days)} · 1€=${CONFIG.rates.EUR}원, 1CHF=${CONFIG.rates.CHF}원 기준</div>
  <h3>도시별</h3>${byCity.map(([c,v])=>`<div class="stat" style="display:block" data-date="${c[0]}"><div style="display:flex;justify-content:space-between"><span>${c[4]} ${esc(c[2])}</span><b>${won(v)}</b></div><div class="barline"><i style="width:${v/max*100}%"></i></div></div>`).join("")}
  <h3>어디에</h3>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="stat"><span>${CAT_ICON[k]||""} ${esc(k)}</span><b>${won(v)}</b></div>`).join("")||`<div class="sub">아직 지출 기록이 없어요</div>`}
  ${settle()}
  <h3>환율</h3><div class="grid2"><label class="sub">1€ = 원<input id="rEUR" class="field" type="number" inputmode="decimal" value="${CONFIG.rates.EUR}"></label><label class="sub">1CHF = 원<input id="rCHF" class="field" type="number" inputmode="decimal" value="${CONFIG.rates.CHF}"></label></div>
  <div class="grid2"><button class="pbtn" data-act="saveRates">환율 저장</button><button class="pbtn ghostbtn" data-act="fetchRates">최신 환율 가져오기</button></div>
  <div class="grid2"><button class="pbtn ghostbtn" data-act="book">📖 여행 책 보기</button>${downloads?`<button class="pbtn ghostbtn" data-act="csv">지출 CSV 저장</button>`:""}</div>
  <button class="pbtn ghostbtn" data-act="close">닫기</button>`;
  $("#sheet").classList.add("show");
}
function settle(){
  const ps=people(); if(ps.length<2) return `<h3>정산</h3><div class="sub">동행이 기록을 남기면 누가 얼마를 보내야 하는지 계산해 드려요. (기록 수정에서 결제한 사람·개인 지출을 바꿀 수 있어요)</div>`;
  const paid={}, owe={}; ps.forEach(p=>{paid[p]=0;owe[p]=0;});
  S.entries.filter(e=>e.type==="spend").forEach(e=>{ const v=krw(e), by=e.by||S.me||"me"; paid[by]=(paid[by]||0)+v; if(e.shared===false) owe[by]=(owe[by]||0)+v; else ps.forEach(p=>owe[p]+=v/ps.length); });
  const bal=ps.map(p=>[p,paid[p]-owe[p]]), give=bal.filter(b=>b[1]<-1).sort((a,b)=>a[1]-b[1]), get=bal.filter(b=>b[1]>1).sort((a,b)=>b[1]-a[1]);
  const tx=[]; let i=0,j=0; while(i<give.length&&j<get.length){ const v=Math.min(-give[i][1],get[j][1]); tx.push(`${esc(nameOf(give[i][0]))} → ${esc(nameOf(get[j][0]))} <b>${won(v)}</b>`); give[i][1]+=v; get[j][1]-=v; if(give[i][1]>=-1)i++; if(get[j][1]<=1)j++; }
  return `<h3>정산</h3>${ps.map(p=>`<div class="stat"><span>${esc(nameOf(p))} 결제</span><b>${won(paid[p])}</b></div>`).join("")}<div class="diary" style="margin-top:8px">${tx.length?tx.join("<br>"):"딱 맞아요, 보낼 돈 없음 🙌"}</div>`;
}
function book(){
  const days=[]; for(let d=FIRST; d<=LAST; d=add(d,1)) days.push(d);
  $("#pane").innerHTML=`<h2>📖 여행 책</h2><div class="sub">${P(FIRST).getMonth()+1}/${P(FIRST).getDate()} – ${P(LAST).getMonth()+1}/${P(LAST).getDate()} · ${TOTAL_DAYS}일</div>
  ${days.map(d=>{ const c=cityOf(d), L=S.entries.filter(e=>e.date===d), day=S.days[d]||{}, ph=L.filter(e=>e.type==="photo"), nt=L.filter(e=>e.type==="note"), pl=L.filter(e=>e.type==="plan"&&e.done), sp=L.filter(e=>e.type==="spend").reduce((s,e)=>s+krw(e),0);
    if(!L.length&&!day.diary&&day.mood==null) return "";
    return `<section class="bookday" data-date="${d}"><div class="dayno">DAY ${dayNo(d)} · ${P(d).getMonth()+1}/${P(d).getDate()}</div><h3>${c?c[4]+" "+esc(c[2]):""} ${day.mood!=null?MOODS[day.mood]:""}</h3>
    ${day.diary?`<p>${esc(day.diary)}</p>`:""}
    ${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${esc(p.url||"/_blob/"+p.assetId)}" alt="${esc(p.text||"사진")}" loading="lazy">`).join("")}</div>`:""}
    ${pl.length?`<div class="sub">📍 ${pl.map(p=>esc(p.text)).join(" · ")}</div>`:""}
    ${nt.map(n=>`<div>✏️ ${esc(n.text)}</div>`).join("")}
    ${sp?`<div class="sub">💸 ${won(sp)}</div>`:""}</section>`; }).join("")||`<div class="empty">아직 기록이 없어요</div>`}
  <button class="pbtn ghostbtn" data-act="stats">← 돌아가기</button>`;
  $("#sheet").classList.add("show"); $("#pane").scrollTop=0;
}

async function wrapUp(){
  const d=S.date, list=S.entries.filter(e=>e.date===d);
  if(!sample){
    $("#pane").innerHTML=`<h2>오늘의 한 장</h2><div class="sub">오늘을 한두 문장으로 남겨요</div><textarea id="ediary" class="field" rows="4">${esc(S.days[d]?.diary||"")}</textarea><button class="pbtn" data-act="saveDiary">저장</button>`;
    $("#sheet").classList.add("show"); $("#ediary").focus(); return;
  }
  toast("오늘을 정리하는 중…");
  const lines=list.map(e=>e.type==="spend"?`[지출] ${e.text} ${money(e)}`:e.type==="plan"?`[${e.done?"다녀옴":"못 감"}] ${e.time} ${e.text}`:e.type==="photo"?`[사진] ${e.text||""}`:`[메모] ${e.text}`).join("\n");
  const mood=S.days[d]?.mood;
  try{
    const r=await sample(`여행 중 하루의 기록이야. 도시: ${cityOf(d)?.[2]||""}, 날짜: ${d}, 기분: ${mood!=null?MOODS[mood]:"모름"}.\n${lines}\n\n이걸 바탕으로 친구에게 말하듯 담백한 한국어 일기 3문장을 써줘. 금액 나열은 하지 말고, 기억에 남을 장면 위주로. 일기 본문만 출력.`,{modelTier:"quick"});
    await setDay(d,{diary:r.text.trim()}); toast("오늘의 한 장 완성");
  }catch(e){ if(e?.code!=="cancelled") toast("정리 실패: "+(e?.code||"오류")); }
}

function editSheet(id){
  const x=S.entries.find(e=>e.id===id); if(!x) return;
  const sel=(id,opts,v)=>`<select id="${id}" class="field">${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  $("#pane").innerHTML=`<h2>${x.type==="photo"?"사진 설명":"기록 수정"}</h2>
  <textarea id="etext" class="field" rows="2" placeholder="내용">${esc(x.text||"")}</textarea>
  <input id="etime" class="field" type="time" value="${esc(x.time||"")}">
  ${x.type==="spend"?`<div class="grid2"><input id="eamt" class="field" type="number" inputmode="decimal" step="0.01" value="${x.amount}">${sel("ecur",["EUR","CHF","KRW"],x.cur)}${sel("ecat",Object.keys(CAT_ICON),x.cat)}${sel("epay",["카드","현금"],x.pay)}</div>
  <div class="grid2"><select id="eby" class="field">${people().map(i=>`<option value="${esc(i)}" ${i===(x.by||S.me||"me")?"selected":""}>${esc(nameOf(i))} 결제</option>`).join("")}</select>
  <select id="eshared" class="field"><option value="1" ${x.shared!==false?"selected":""}>함께 쓴 돈</option><option value="0" ${x.shared===false?"selected":""}>개인 지출</option></select></div>`:""}
  <button class="pbtn" data-act="saveEdit" data-id="${id}">저장</button>
  <button class="pbtn danger" data-act="delEdit" data-id="${id}">삭제</button>`;
  $("#sheet").classList.add("show");
}
async function removeEntry(id){
  const x=S.entries.find(e=>e.id===id); if(!x) return;
  await delEntry(id);
  if(x.type==="photo"&&assets&&x.assetId){ S.undo=null; try{ await assets.delete(x.assetId); }catch{} toast("사진을 지웠어요"); return; }
  S.undo={...x};
  const t=$("#toast"); t.innerHTML=`지웠어요 <button data-act="undo" style="color:inherit;text-decoration:underline;margin-left:8px">되돌리기</button>`;
  t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>{t.classList.remove("show");S.undo=null;},4000);
}

/* ---------- 이벤트 ---------- */
function go(d){ S.date=d; render(); scrollTo({top:0}); }
$("#q").addEventListener("input",()=>{ S.force=null; updateGuess(); });
const TOUCH=matchMedia("(pointer:coarse)").matches;
$("#q").addEventListener("keydown",e=>{ if(!TOUCH&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("#send").click(); } });
$("#send").addEventListener("click",safe(async()=>{
  const items=current(); if(!items.length) return;
  $("#q").value=""; S.force=null; updateGuess();
  for(const it of items) await addEntry(it);
  toast(items.length>1?`${items.length}개 기록`:TYPE_LABEL[items[0].type]+" 기록");
}));
$("#file").addEventListener("change",safe(async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  if(!assets){ toast("사진은 claude.ai에서 열었을 때 올릴 수 있어요"); return; }
  const cap=$("#q").value.trim(); $("#q").value=""; updateGuess();
  toast(`사진 ${files.length}장 올리는 중…`);
  for(const f of files){ const r=await assets.upload(f); await addEntry({date:S.date,type:"photo",assetId:r.id,url:r.url,text:cap,time:tnow()}); }
  toast("사진 저장");
}));
let sx=null, sy=0;
$("#app").addEventListener("touchstart",e=>{ if(!e.target.closest(".route")) { sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
$("#app").addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null; if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)) go(add(S.date,dx<0?1:-1)); });
document.addEventListener("click",safe(async e=>{
  const t=e.target.closest("button,[data-date]"); if(!t) return;
  if(e.target===$("#sheet")) return $("#sheet").classList.remove("show");
  const ds=t.dataset;
  if(ds.force){ S.force=ds.force; updateGuess(); $("#q").focus(); return; }
  if(ds.date){ $("#sheet").classList.remove("show"); go(ds.date); return; }
  if(ds.step){ go(add(S.date,+ds.step)); return; }
  if(ds.mood){ const m=+ds.mood; await setDay(S.date,{mood:S.days[S.date]?.mood===m?null:m}); return; }
  if(ds.done){ const x=S.entries.find(e=>e.id===ds.done); await updEntry(ds.done,{done:!x.done}); return; }
  if(ds.del){ await removeEntry(ds.del); return; }
  if(ds.cap){ editSheet(ds.cap); return; }
  if(ds.act==="saveEdit"){ const id=ds.id, x=S.entries.find(e=>e.id===id), patch={text:$("#etext").value.trim(),time:$("#etime").value};
    if(x.type==="spend"){ const a=parseFloat($("#eamt").value); if(!(a>0)) return toast("금액을 확인해주세요"); patch.amount=a; patch.cur=$("#ecur").value; patch.cat=$("#ecat").value; patch.pay=$("#epay").value; patch.by=$("#eby").value; patch.shared=$("#eshared").value==="1"; }
    await updEntry(id,patch); $("#sheet").classList.remove("show"); toast("수정했어요"); return; }
  if(ds.act==="delEdit"){ $("#sheet").classList.remove("show"); await removeEntry(ds.id); return; }
  if(ds.act==="undo"){ const u=S.undo; S.undo=null; $("#toast").classList.remove("show"); if(u){ delete u.id; await addEntry(u); } return; }
  if(ds.act==="saveDiary"){ await setDay(S.date,{diary:$("#ediary").value.trim()}); $("#sheet").classList.remove("show"); return; }
  if(ds.act==="stats") stats();
  if(ds.act==="book") book();
  if(ds.act==="saveRates"){ const e=parseFloat($("#rEUR").value), c=parseFloat($("#rCHF").value); if(!(e>0&&c>0)) return toast("환율을 확인해주세요"); await saveRates({EUR:e,CHF:c}); toast("환율 저장"); stats(); }
  if(ds.act==="fetchRates"){ try{ const [a,b]=await Promise.all(["EUR","CHF"].map(f=>fetch(`https://api.frankfurter.app/latest?from=${f}&to=KRW`).then(r=>r.json()))); $("#rEUR").value=Math.round(a.rates.KRW); $("#rCHF").value=Math.round(b.rates.KRW); toast("최신 환율을 넣었어요 · 저장을 눌러주세요"); }catch{ toast("여기선 환율을 못 가져와요 · 직접 입력해주세요"); } }
  if(ds.act==="csv"){ const rows=[["날짜","시간","도시","카테고리","내용","금액","통화","원화","결제","결제자","구분"]].concat(S.entries.filter(e=>e.type==="spend").sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).map(e=>[e.date,e.time||"",cityOf(e.date)?.[2]||"",e.cat,e.text,e.amount,e.cur,Math.round(krw(e)),e.pay,nameOf(e.by),e.shared===false?"개인":"공동"]));
    const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    try{ await downloads.save({filename:"여행경비.csv",data:new Blob([csv],{type:"text/csv"})}); }catch(e){ if(e?.code!=="cancelled"&&e?.code!=="declined") toast("저장 못 했어요"); } }
  if(ds.act==="close") $("#sheet").classList.remove("show");
  if(ds.act==="wrap") await wrapUp();
}));
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("show"); });

/* ---------- 시작 ---------- */
local(); render();
try{ const c=document.createElement("canvas"); c.width=c.height=180; const g=c.getContext("2d"); g.fillStyle="#e2572b"; g.fillRect(0,0,180,180); g.font="110px serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("🧳",90,98);
  const u=c.toDataURL("image/png"); for(const rel of ["apple-touch-icon","icon"]){ const l=document.createElement("link"); l.rel=rel; l.href=u; document.head.appendChild(l); } }catch{}
(async()=>{
  if(!window.claude?.use) return;
  const [d,a,s,u,dl]=await Promise.all(["db","assets","sample","user","downloads"].map(n=>window.claude.use(n)));
  assets=a; sample=s; user=u; downloads=dl;
  if(user){ try{ S.me=await user.id(); }catch{} }
  if(d){
    db=d;
    db.collection("entries").onSnapshot(sn=>{ S.entries=sn.docs.map(x=>({...x.data(),id:x.id})); render(); if(people().some(i=>i!==S.me&&i!=="me"&&!(i in S.names))) loadNames().then(render); },err=>toast("동기화 오류: "+err.code));
    db.collection("meta").doc("settings").onSnapshot(sn=>{ const r=sn.data()?.rates; if(r){ Object.assign(CONFIG.rates,r); render(); } });
    db.collection("days").onSnapshot(sn=>{ S.days={}; sn.docs.forEach(x=>S.days[x.id]=x.data()); render(); });
  }
  render();
})();
</script>
</body>
</html>
